<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>GLB AR Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="mode-menu">

  <!-- Start / settings card. Hidden while previewing or in AR. -->
  <div id="landing">
    <div class="card">
      <h1>GLB AR Lab</h1>
      <p class="sub">WebXR floor placement + rendering stress test</p>

      <section>
        <label class="field">Model
          <select id="modelSelect"></select>
        </label>
        <label class="field file">Or open a local file
          <input type="file" id="fileInput" accept=".glb,.gltf,model/gltf-binary">
        </label>
        <div id="loadBar"><div></div></div>
        <div id="loadStatus" class="mono">Loading model list…</div>
      </section>

      <section class="settings">
        <label class="field">AR resolution scale
          <select id="fbScale">
            <option value="0.5">0.5× (fastest)</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0× (browser default)</option>
            <option value="native">Native (full sensor res)</option>
          </select>
        </label>
        <label class="field">Fixed foveation <span id="foveationVal">0</span>
          <input type="range" id="foveation" min="0" max="1" step="0.25" value="0">
        </label>
        <label class="check"><input type="checkbox" id="aa"> MSAA antialiasing <small>(reloads page)</small></label>
      </section>

      <div class="actions">
        <button id="enterAR" class="primary" disabled>Enter AR</button>
        <button id="preview">Preview here (no AR)</button>
      </div>
      <p id="xrSupport" class="mono small"></p>
    </div>
  </div>

  <!-- DOM overlay root: shown on top of the camera feed in AR, and on top of the canvas in preview. -->
  <div id="overlay">
    <div id="hudWrap" class="ui">
      <div id="hud" class="panel mono"></div>
      <canvas id="graph" width="240" height="48"></canvas>
    </div>
    <div id="log" class="panel mono ui hidden"></div>
    <div id="hint"></div>
    <div id="controls" class="ui">
      <button id="btnExit">Menu</button>
      <button id="btnMove" class="ar-only">Move</button>
      <button id="btnSmaller">−</button>
      <button id="btnBigger">+</button>
      <button id="btnRotate">⟳ 45°</button>
      <button id="btnReal">1:1</button>
      <button id="btnClonesMinus">−copy</button>
      <button id="btnClones">+copy</button>
      <button id="btnAnim">Anim</button>
      <button id="btnShadow">Shadow</button>
      <button id="btnMat">Mat</button>
      <button id="btnFps" class="ar-only hidden">Hz</button>
      <button id="btnHud">HUD</button>
      <button id="btnLog">Log</button>
      <button id="btnBench" class="accent">Bench 10s</button>
      <button id="btnReport">Report</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
