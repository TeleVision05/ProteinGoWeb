name: Deploy frontend to GitHub Pages

# Manual only for now: the API has to be hosted somewhere and VITE_API_URL set before this is useful.
# To deploy on every push, add back a `push:` trigger for `apps/frontend/**`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Project site lives under /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set repo variables VITE_API_URL and secret VITE_MAPBOX_TOKEN
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      # GitHub Pages has no SPA rewrites; serve the app shell for unknown paths.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
