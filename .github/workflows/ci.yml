name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proteingo
          POSTGRES_PASSWORD: proteingo
          POSTGRES_DB: proteingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proteingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://proteingo:proteingo@localhost:5432/proteingo
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production-0000
      BETTER_AUTH_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Create tables
        run: npx drizzle-kit push --force
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
