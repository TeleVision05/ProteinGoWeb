# TEST deployment on Render (free tier): one web service (API + frontend, built from the Dockerfile) and a
# Postgres database. It redeploys on every push to the connected branch.
#
# This is NOT a production setup. The dev sign-in bypass is ON, so anyone with the URL can open /admin.
# That is why NODE_ENV is "staging": the bypass refuses to run when NODE_ENV is "production".
# For a real deployment see "Production" in DEPLOY.md.
databases:
  - name: proteingo-test-db
    plan: free
    databaseName: proteingo

services:
  - type: web
    name: proteingo-test
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: proteingo-test-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Dev sign-in: pick "Dev admin" or "Dev student" on the login page. No Google account needed.
      - key: DEV_BYPASS_AUTH
        value: "true"
      - key: DEV_BYPASS_EMAIL
        value: dev@ucr.edu
      - key: DEV_STUDENT_EMAIL
        value: student@ucr.edu
      - key: ADMIN_EMAILS
        value: dev@ucr.edu
      # Create / update the database tables on every start (safe for a throwaway test database).
      - key: AUTO_DB_PUSH
        value: "true"
      # Baked into the frontend at build time. Copy yours from apps/frontend/.env.
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_ENABLE_DEBUG_TOOLS
        value: "true"
